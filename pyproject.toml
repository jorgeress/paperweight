[project]
name = "paperweight"
version = "0.1.0"
description = "A piece of paper shouldn't be able to command your robot."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "opencv-python-headless>=4.10",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "pillow>=11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperweight"]
